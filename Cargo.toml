[package]
name = "ruststrap"
version = "0.1.0"
edition = "2021"
description = "A Rust reimplementation of Bloxstrap - a custom Roblox bootstrapper"
license = "MIT"
build = "build.rs"

[[bin]]
name = "ruststrap"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
eframe = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.10"
winreg = "0.52"
base64 = "0.22"
anyhow = "1"
webbrowser = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
